name: Publish Library & Deploy Storybook

on:
  push:
    branches:
      - main
      - staging
      - dev
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      force_publish:
        description: 'Force library publish (ignore version check)'
        required: false
        type: boolean
        default: false

# Concurrency lock: only one release pipeline per branch/environment at a time
concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

permissions:
  id-token: write        # Required for OIDC
  contents: read
  packages: write        # Required for npm publish
  security-events: write # Required for CodeQL

jobs:
  # Stage 1: Validate (lint, typecheck, format, tests, security)
  test:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run Linter
        run: npm run lint
      
      - name: Run Type Check
        run: npm run typecheck
      
      - name: Run Format Check
        run: npm run format:check
      
      - name: Run Unit Tests
        run: npm test
      
      - name: Run Token Compliance Check
        run: npm run check:tokens
      
      - name: Verify Storybook Build
        run: npm run build-storybook
      
      - name: Run Security Audit
        run: npm audit --audit-level=high
        continue-on-error: false
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Stage 2: Build once and upload artifacts
  build:
    name: Build Library & Storybook
    runs-on: ubuntu-latest
    needs: test
    outputs:
      should_publish: ${{ steps.version-check.outputs.should_publish }}
      base_version: ${{ steps.version-check.outputs.base_version }}
      candidate_version: ${{ steps.version-check.outputs.candidate_version }}
      environment: ${{ steps.env-detect.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@amuaapps'
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      
      - name: Detect Environment
        id: env-detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              main) ENV="prod" ;;
              staging) ENV="staging" ;;
              dev|develop|*) ENV="dev" ;;
            esac
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Environment: $ENV"
      
      - name: Check Version and Generate Candidate
        id: version-check
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          
          # Generate deterministic candidate version using run number
          CANDIDATE_VERSION="${BASE_VERSION}-next.${{ github.run_number }}"
          
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "candidate_version=$CANDIDATE_VERSION" >> $GITHUB_OUTPUT
          
          echo "Base version: $BASE_VERSION"
          echo "Candidate version: $CANDIDATE_VERSION"
          
          # Configure npm to query GitHub Packages
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          echo "@amuaapps:registry=https://npm.pkg.github.com" >> ~/.npmrc
          
          # Check if this exact version already exists in GitHub Packages
          if npm view "$PACKAGE_NAME@$CANDIDATE_VERSION" version 2>/dev/null; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "⚠️  Version $CANDIDATE_VERSION already exists - skipping publish"
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✓ Version $CANDIDATE_VERSION does not exist - will publish"
          fi
      
      - name: Build Library
        run: npm run build
      
      - name: Build Storybook
        run: npm run build-storybook
      
      - name: Upload Library Artifacts
        if: steps.version-check.outputs.should_publish == 'true' || github.event.inputs.force_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: library-dist
          path: dist/
          retention-days: 7
      
      - name: Upload Storybook Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  # Stage 3: Publish candidate version tagged as 'next' (never 'latest')
  publish-candidate:
    name: Publish Candidate (next)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.should_publish == 'true' || github.event.inputs.force_publish == 'true'
    environment: ${{ needs.build.outputs.environment }}
    outputs:
      published_version: ${{ steps.publish.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@amuaapps'
      
      - name: Download Library Artifacts
        uses: actions/download-artifact@v4
        with:
          name: library-dist
          path: dist/
      
      - name: Update package.json version
        run: |
          # Update version to candidate version
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ needs.build.outputs.candidate_version }}';
            delete pkg.scripts.prepare;
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "Updated package.json to version ${{ needs.build.outputs.candidate_version }}"
      
      - name: Configure npm authentication
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          echo "@amuaapps:registry=https://npm.pkg.github.com" >> ~/.npmrc
      
      - name: Publish to GitHub Packages (tagged as 'next')
        id: publish
        run: |
          # Publish with 'next' tag (never 'latest')
          npm publish --tag next
          echo "version=${{ needs.build.outputs.candidate_version }}" >> $GITHUB_OUTPUT
          echo "✓ Published ${{ needs.build.outputs.candidate_version }} with tag 'next'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 4: Smoke-test candidate and promote to 'latest' if it passes
  smoke-test-and-promote:
    name: Smoke Test & Promote
    runs-on: ubuntu-latest
    needs: [build, publish-candidate]
    if: needs.build.outputs.should_publish == 'true' || github.event.inputs.force_publish == 'true'
    environment: ${{ needs.build.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@amuaapps'
      
      - name: Install candidate version in smoke-test
        run: |
          cd smoke-test
          
          # Configure npm authentication for GitHub Packages
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@amuaapps:registry=https://npm.pkg.github.com" >> .npmrc
          
          # Install dependencies first
          npm install
          
          # Remove existing library if present
          npm uninstall @amuaapps/ui-library 2>/dev/null || true
          
          # Install the 'next' tagged version (our candidate)
          npm install @amuaapps/ui-library@next
          
          INSTALLED_VERSION=$(node -p "require('./node_modules/@amuaapps/ui-library/package.json').version")
          echo "Installed version: $INSTALLED_VERSION"
          
          # Verify it's the candidate version
          if [ "$INSTALLED_VERSION" != "${{ needs.build.outputs.candidate_version }}" ]; then
            echo "❌ Error: Expected version ${{ needs.build.outputs.candidate_version }}, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "✓ Candidate version installed successfully"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run smoke-test build
        run: |
          cd smoke-test
          npm test
          echo "✓ Smoke test passed"
      
      - name: Promote to 'latest' dist-tag
        run: |
          # Only promote if smoke-test passed
          npm dist-tag add @amuaapps/ui-library@${{ needs.build.outputs.candidate_version }} latest
          echo "✓ Promoted ${{ needs.build.outputs.candidate_version }} to 'latest'"
          
          # Verify promotion
          LATEST_VERSION=$(npm view @amuaapps/ui-library@latest version)
          echo "Latest version is now: $LATEST_VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Git Tag
        if: needs.build.outputs.environment == 'prod'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.build.outputs.candidate_version }}" -m "Release v${{ needs.build.outputs.candidate_version }}"
          git push origin "v${{ needs.build.outputs.candidate_version }}"

  # Step 5: Deploy Storybook
  deploy:
    name: Deploy Storybook
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: ${{ needs.build.outputs.environment }}
    outputs:
      provider: ${{ steps.detect-provider.outputs.provider }}
      green_url: ${{ steps.deploy-azure.outputs.green_url || steps.deploy-aws.outputs.green_url }}
      resource_group: ${{ steps.deploy-azure.outputs.resource_group || steps.deploy-aws.outputs.resource_group }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Storybook Artifacts
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
      
      - name: Detect Cloud Provider
        id: detect-provider
        run: |
          # Check for Azure-specific files
          if [ -d "infra/azure" ] && [ -f "infra/azure/storybook/bicep/main.bicep" ]; then
            echo "provider=azure" >> $GITHUB_OUTPUT
            echo "Detected Azure provider"
          # Check for AWS-specific files
          elif [ -d "infra/aws" ] && [ -f "infra/aws/storybook/terraform/main.tf" ]; then
            echo "provider=aws" >> $GITHUB_OUTPUT
            echo "Detected AWS provider"
          else
            echo "❌ Error: No cloud provider detected"
            echo "Expected either infra/azure/storybook/bicep or infra/aws/storybook/terraform"
            exit 1
          fi
      
      # Azure Deployment
      - name: Azure Login (OIDC)
        if: steps.detect-provider.outputs.provider == 'azure'
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy to Azure
        if: steps.detect-provider.outputs.provider == 'azure'
        id: deploy-azure
        run: |
          # Install Bicep
          az bicep install
          
          # Set resource group
          if [ -n "${{ vars.AZURE_RESOURCE_GROUP_NAME }}" ]; then
            RG="${{ vars.AZURE_RESOURCE_GROUP_NAME }}"
          else
            RG="rg-ui-library-${{ needs.build.outputs.environment }}"
          fi
          
          REGION="${{ vars.AZURE_REGION || 'eastus' }}"
          
          echo "Resource Group: $RG"
          echo "Region: $REGION"
          
          # Verify resource group exists
          if az group show --name "$RG" &> /dev/null; then
            echo "✓ Resource group $RG exists"
          else
            echo "❌ Error: Resource group $RG does not exist"
            echo "Please create the resource group first:"
            echo "  az group create --name $RG --location $REGION"
            exit 1
          fi
          
          # Generate parameters
          cd infra/azure/storybook/bicep
          cat > parameters.generated.json <<EOF
          {
            "\$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "projectName": { "value": "ui-library" },
              "environment": { "value": "${{ needs.build.outputs.environment }}" },
              "location": { "value": "$REGION" },
              "enableBlueGreen": { "value": true },
              "enableCdn": { "value": false },
              "customDomainName": { "value": "${{ vars.AZURE_CUSTOM_DOMAIN || '' }}" },
              "dnsZoneResourceId": { "value": "${{ vars.AZURE_DNS_ZONE_ID || '' }}" },
              "retentionPolicyDays": { "value": 30 },
              "tags": {
                "value": {
                  "Project": "UI Library",
                  "Environment": "${{ needs.build.outputs.environment }}",
                  "ManagedBy": "GitHub Actions"
                }
              },
              "activeEnvironment": { "value": "blue" }
            }
          }
          EOF
          
          # Deploy infrastructure
          DEPLOYMENT_NAME="storybook-$(date +%Y%m%d-%H%M%S)"
          az deployment group create \
            --resource-group "$RG" \
            --template-file main.bicep \
            --parameters parameters.generated.json \
            --name "$DEPLOYMENT_NAME"
          
          # Get outputs using the deployment name
          BLUE_ACCOUNT=$(az deployment group show \
            --resource-group "$RG" \
            --name "$DEPLOYMENT_NAME" \
            --query 'properties.outputs.uploadTargetBlue.value' \
            --output tsv)
          GREEN_ACCOUNT=$(az deployment group show \
            --resource-group "$RG" \
            --name "$DEPLOYMENT_NAME" \
            --query 'properties.outputs.uploadTargetGreen.value' \
            --output tsv)
          
          GREEN_URL=$(az deployment group show \
            --resource-group "$RG" \
            --name "$DEPLOYMENT_NAME" \
            --query 'properties.outputs.storybookUrlGreen.value' \
            --output tsv)
          
          CDN_PROFILE=$(az deployment group show \
            --resource-group "$RG" \
            --name "$DEPLOYMENT_NAME" \
            --query 'properties.outputs.cdnProfileName.value' \
            --output tsv 2>/dev/null || echo "")
          
          CDN_ENDPOINT=$(az deployment group show \
            --resource-group "$RG" \
            --name "$DEPLOYMENT_NAME" \
            --query 'properties.outputs.cdnEndpointName.value' \
            --output tsv 2>/dev/null || echo "")
          
          # Note: Static website hosting is now configured by Bicep deployment scripts
          # No manual enablement needed
          
          echo "green_account=$GREEN_ACCOUNT" >> $GITHUB_OUTPUT
          echo "green_url=$GREEN_URL" >> $GITHUB_OUTPUT
          echo "cdn_profile=$CDN_PROFILE" >> $GITHUB_OUTPUT
          echo "cdn_endpoint=$CDN_ENDPOINT" >> $GITHUB_OUTPUT
          echo "resource_group=$RG" >> $GITHUB_OUTPUT
          
          # Upload to GREEN
          cd ../../../../
          chmod +x infra/shared/storybook/upload-azure.sh
          
          if [ -n "$CDN_PROFILE" ] && [ -n "$CDN_ENDPOINT" ]; then
            ./infra/shared/storybook/upload-azure.sh \
              -a "$GREEN_ACCOUNT" \
              -g "$RG" \
              --purge-cdn \
              --cdn-profile "$CDN_PROFILE" \
              --cdn-endpoint "$CDN_ENDPOINT"
          else
            ./infra/shared/storybook/upload-azure.sh \
              -a "$GREEN_ACCOUNT" \
              -g "$RG"
          fi
          
          echo "✓ Deployed to Azure GREEN environment"
          echo "URL: $GREEN_URL"
      
      # AWS Deployment
      - name: Configure AWS Credentials (OIDC)
        if: steps.detect-provider.outputs.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Deploy to AWS
        if: steps.detect-provider.outputs.provider == 'aws'
        id: deploy-aws
        run: |
          # Install Terraform
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform
          
          cd infra/aws/storybook/terraform
          
          # Generate tfvars
          cat > terraform.auto.tfvars <<EOF
          project_name        = "ui-library"
          environment         = "${{ needs.build.outputs.environment }}"
          region              = "${{ vars.AWS_REGION }}"
          enable_blue_green   = true
          enable_cdn          = true
          custom_domain_name  = "${{ vars.AWS_CUSTOM_DOMAIN || '' }}"
          route53_zone_id     = "${{ vars.AWS_ROUTE53_ZONE_ID || '' }}"
          retention_policy_days = 30
          tags = {
            Project     = "UI Library"
            Environment = "${{ needs.build.outputs.environment }}"
            ManagedBy   = "GitHub Actions"
          }
          EOF
          
          # Initialize Terraform with remote backend (if configured)
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "Configuring remote backend..."
            terraform init \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=ui-library/storybook/${{ needs.build.outputs.environment }}/terraform.tfstate" \
              -backend-config="region=${{ vars.TF_STATE_REGION || 'us-east-1' }}" \
              -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE || 'terraform-state-locks' }}" \
              -backend-config="encrypt=true"
          else
            echo "Using local backend (no TF_STATE_BUCKET configured)"
            terraform init
          fi
          
          # Deploy infrastructure
          terraform apply -auto-approve
          
          # Get outputs
          GREEN_BUCKET=$(terraform output -raw upload_target_green)
          GREEN_URL=$(terraform output -raw storybook_url_green)
          DIST_ID=$(terraform output -raw cdn_distribution_id 2>/dev/null || echo "")
          
          echo "green_bucket=$GREEN_BUCKET" >> $GITHUB_OUTPUT
          echo "green_url=$GREEN_URL" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT
          
          # Upload to GREEN (without invalidation - that happens after switch)
          cd ../../../../
          chmod +x infra/shared/storybook/upload-aws.sh
          ./infra/shared/storybook/upload-aws.sh -b "$GREEN_BUCKET"
          
          # Verify GREEN deployment
          cd infra/aws/storybook/terraform
          chmod +x scripts/verify-green.sh
          ./scripts/verify-green.sh "$GREEN_BUCKET"
          
          echo "✓ Deployed and verified AWS GREEN environment"
          echo "URL: $GREEN_URL"

  # Step 6: Verify & Switch Blue-Green
  switch:
    name: Verify & Switch to GREEN
    runs-on: ubuntu-latest
    needs: [build, deploy]
    environment: ${{ needs.build.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Wait for Storage Propagation
        run: |
          echo "Waiting 10 seconds for storage propagation..."
          sleep 10
      
      - name: Verify GREEN Deployment
        run: |
          chmod +x infra/shared/storybook/verify.sh
          ./infra/shared/storybook/verify.sh \
            -u "${{ needs.deploy.outputs.green_url }}" \
            --verbose
      
      # Azure Switch
      - name: Azure Login (OIDC)
        if: needs.deploy.outputs.provider == 'azure'
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: Switch to GREEN (Azure)
        if: needs.deploy.outputs.provider == 'azure'
        run: |
          cd infra/azure/storybook/bicep
          
          # Create parameters.json for the switch script
          cat > parameters.json <<EOF
          {
            "\$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "projectName": { "value": "ui-library" },
              "environment": { "value": "${{ needs.build.outputs.environment }}" },
              "location": { "value": "${{ vars.AZURE_REGION || 'eastus' }}" },
              "enableBlueGreen": { "value": true },
              "enableCdn": { "value": false },
              "customDomainName": { "value": "${{ vars.AZURE_CUSTOM_DOMAIN || '' }}" },
              "dnsZoneResourceId": { "value": "${{ vars.AZURE_DNS_ZONE_ID || '' }}" },
              "retentionPolicyDays": { "value": 30 },
              "tags": {
                "value": {
                  "Project": "UI Library",
                  "Environment": "${{ needs.build.outputs.environment }}",
                  "ManagedBy": "GitHub Actions"
                }
              },
              "activeEnvironment": { "value": "green" }
            }
          }
          EOF
          
          chmod +x switch.sh
          ./switch.sh green -g "${{ needs.deploy.outputs.resource_group }}" --auto-approve
      
      # AWS Switch
      - name: Configure AWS Credentials (OIDC)
        if: needs.deploy.outputs.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Switch to GREEN (AWS)
        if: needs.deploy.outputs.provider == 'aws'
        run: |
          # Install Terraform
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform
          
          cd infra/aws/storybook/terraform
          
          # Initialize Terraform with same remote backend as deploy
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "Configuring remote backend..."
            terraform init \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=ui-library/storybook/${{ needs.build.outputs.environment }}/terraform.tfstate" \
              -backend-config="region=${{ vars.TF_STATE_REGION || 'us-east-1' }}" \
              -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE || 'terraform-state-locks' }}" \
              -backend-config="encrypt=true"
          else
            echo "Using local backend (no TF_STATE_BUCKET configured)"
            terraform init
          fi
          
          chmod +x switch.sh
          ./switch.sh green --auto-approve
          
          # Invalidate CloudFront cache after switch (if CDN enabled)
          DIST_ID=$(terraform output -raw cdn_distribution_id 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ]; then
            echo "Invalidating CloudFront cache..."
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
            echo "✓ CloudFront cache invalidated"
          fi
      
      - name: Deployment Summary
        run: |
          echo "## Deployment Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.build.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Provider:** ${{ needs.deploy.outputs.provider }}" >> $GITHUB_STEP_SUMMARY
          echo "**Storybook URL:** ${{ needs.deploy.outputs.green_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build.outputs.should_publish }}" = "true" ]; then
            echo "### Library Release" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** ${{ needs.build.outputs.candidate_version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Published and promoted to \`latest\`" >> $GITHUB_STEP_SUMMARY
            echo "**Smoke Test:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npm install @amuaapps/ui-library@latest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Library:** No new version published" >> $GITHUB_STEP_SUMMARY
          fi
