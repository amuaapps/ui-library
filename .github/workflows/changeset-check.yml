name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check for Changeset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for changeset
        id: changeset-check
        run: |
          # Check if PR has 'skip-changeset' label
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}" == "true" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Changeset check skipped due to 'skip-changeset' label"
            exit 0
          fi
          
          # Check if there are any changesets
          if npx changeset status --since=origin/${{ github.base_ref }} 2>&1 | grep -q "No changesets present"; then
            echo "has_changeset=false" >> $GITHUB_OUTPUT
            echo "❌ No changeset found"
            exit 1
          else
            echo "has_changeset=true" >> $GITHUB_OUTPUT
            echo "✅ Changeset found"
          fi

      - name: Comment on PR (missing changeset)
        if: failure() && steps.changeset-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ⚠️ Missing Changeset
            
            This PR doesn't include a changeset file. Changesets are required to track version changes and generate changelogs.
            
            ### To add a changeset:
            
            \`\`\`bash
            npm run changeset
            \`\`\`
            
            Follow the prompts to:
            1. Select the type of change (major, minor, or patch)
            2. Describe the change for the changelog
            
            Then commit the generated changeset file.
            
            ### Skip changeset (if needed):
            
            If this PR doesn't require a version bump (e.g., docs-only changes), add the \`skip-changeset\` label.
            
            **Allowed skip cases:**
            - Documentation updates only
            - CI/CD configuration changes
            - Development tooling changes
            - Test-only changes
            
            ---
            
            📚 [Learn more about changesets](https://github.com/changesets/changesets/blob/main/docs/adding-a-changeset.md)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Comment on PR (changeset found)
        if: success() && steps.changeset-check.outputs.has_changeset == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ✅ Changeset Detected
            
            This PR includes a changeset. Version will be bumped and changelog updated upon merge.
            
            Run \`npm run changeset:status\` locally to see the planned version changes.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
