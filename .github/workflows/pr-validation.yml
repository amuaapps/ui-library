name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run token compliance check
        run: npm run check:tokens

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔍 PR Validation Results\n\n';
            
            if ('${{ job.status }}' === 'success') {
              comment += '✅ All checks passed! This PR is ready for review.\n\n';
            } else {
              comment += '❌ Some checks failed. Please review the workflow logs.\n\n';
            }
            
            comment += '### Checks Performed\n';
            comment += '- Linting\n';
            comment += '- Type checking\n';
            comment += '- Code formatting\n';
            comment += '- Unit tests with coverage\n';
            comment += '- Token compliance\n';
            comment += '- Build verification\n';
            comment += '- Storybook build\n';
            comment += '- Security audit\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
